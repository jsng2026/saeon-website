<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://hnorhxknuagtshmsbjdx.supabase.co; base-uri 'none'; form-action 'none'">
  <title>Cushion · Trusted Party</title>
  <style>
    body{margin:0;background:#fff8f0;color:#3d2e5c;font:18px/1.6 system-ui,sans-serif;display:grid;place-items:center;min-height:100svh}
    main{background:white;margin:24px;padding:32px;border-radius:24px;max-width:460px;box-shadow:0 8px 40px #3d2e5c0c}
    h1{font:500 32px/1.2 Georgia,serif}button{font:inherit;font-weight:700;border:0;border-radius:24px;padding:12px 24px;background:#f8c8dc;color:#3d2e5c;cursor:pointer}
    button:focus-visible{outline:3px solid #3d2e5c;outline-offset:4px}button:disabled{opacity:.6;cursor:wait}.quiet{font-size:14px;color:#7c6b98}
  </style>
</head>
<body><main>
  <p class="quiet">SAE:ON · Cushion</p><h1 id="title">Trusted Party</h1>
  <p id="description">Open the link from your Cushion email to continue.</p>
  <button id="submit" hidden></button>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="quiet">Opening this page changes nothing. No browsing history or email addresses are displayed or stored here.</p>
  <noscript>Please enable JavaScript to use the confirmation button.</noscript>
</main>
<script>
const params=new URLSearchParams(location.hash.slice(1));
const action=params.has('confirm')?'confirm':'unsubscribe';
const token=params.get(action);
history.replaceState(null,'',location.pathname);
const button=document.getElementById('submit'),status=document.getElementById('status');
if(token&&/^[0-9a-f-]{36}$/i.test(token)){
 document.getElementById('title').textContent=action==='confirm'?'Be their Trusted Party?':'Stop Cushion emails?';
 document.getElementById('description').textContent=action==='confirm'?'Confirm that you agree to receive browsing reports and accountability alerts from the person who invited you. Reports can be delayed until their phone is active.':'This stops reports and alerts for this relationship. The person who invited you will see that you opted out when Cushion next refreshes.';
 button.textContent=action==='confirm'?'Confirm':'Stop emails';button.hidden=false;
 button.addEventListener('click',async()=>{
  button.disabled=true;status.textContent='Saving your choice…';
  try{
   const response=await fetch('https://hnorhxknuagtshmsbjdx.supabase.co/functions/v1/send-spotcheck',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({consentAction:action,actionToken:token})});
   if(!response.ok)throw new Error('Your choice could not be saved. Please try again.');
   status.textContent=await response.text();button.hidden=true;
  }catch(error){status.textContent=error.message;button.disabled=false;}
 });
}
</script></body></html>
